[project]
name = "agentic-research"
version = "0.1.0"
description = "Sistema agéntico de investigación: un supervisor coordina agentes que investigan, analizan y redactan informes sobre tus documentos"
readme = "README.md"
authors = [
    { name = "icallepe", email = "isabelacalleperez@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-redis>=0.5.2",
    "openinference-instrumentation-langchain>=0.1.82",
    "pydantic>=2.14.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentic-research = "agentic_research.app.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]

omit =[
    "app/worker.py",
    "app/runner.py",
    "app/llm.py",
    "app./rag.py",
    "app/qa.py",
    "app/observability.py",
    "app/infrastructure/chroma_retriever.py",
    "app/infrastructure/redis_jobs.py",

]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["app", "test"]
typeCheckingMode = "basic"
